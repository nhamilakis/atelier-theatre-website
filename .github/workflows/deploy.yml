name: Deploy to GitHub Pages (test)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create a temporary page
        run: |
          mkdir -p temp-site
          cat > temp-site/index.html <<'EOF'
          <!doctype html>
          <html>
            <head><meta charset="utf-8"><title>Coming soon</title></head>
            <body>
              <h1>Coming soon</h1>
              <p>Deployment test OK.</p>
            </body>
          </html>
          EOF

      - name: Upload as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: temp-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
